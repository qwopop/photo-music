# Local PostgreSQL for development. See "Local database" in README.md.
#
#   docker compose up -d --wait   start it, and wait until it accepts connections
#   docker compose down           stop it and keep the data
#   docker compose down -v        stop it and delete all data
#
# The credentials are development defaults, not secrets: the database listens
# only on this computer's loopback interface. They match the local
# DATABASE_URL in .env.example:
#
#   postgresql://photo_music:photo_music_dev@localhost:54320/photo_music
#
# The image applies POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB only when
# it creates a new, empty volume. After changing them, or the PostgreSQL major
# version, run `docker compose down -v` to start over.

name: photo-music

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: photo_music
      POSTGRES_PASSWORD: photo_music_dev
      POSTGRES_DB: photo_music
    ports:
      # Port 54320 on 127.0.0.1 only, so the weak password stays off the
      # network and a PostgreSQL server already using 5432 is not in the way.
      - "127.0.0.1:54320:5432"
    volumes:
      # From version 18 the image keeps its data in a subfolder of
      # /var/lib/postgresql (18/docker), and refuses to start with a mount at
      # the old /var/lib/postgresql/data path.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Lets `docker compose up --wait` return only once the server accepts
      # connections. It checks over TCP, not the Unix socket: on first start,
      # the image sets up the database with a temporary server that listens
      # only on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "photo_music", "-d", "photo_music"]
      start_period: 60s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    # The upstream registry images are unavailable; compile official pinned
    # sources instead. Go verifies dependencies against upstream go.sum.
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24.2-bookworm AS build
        ENV GOTOOLCHAIN=local CGO_ENABLED=0
        WORKDIR /src
        RUN git clone --branch RELEASE.2025-04-22T22-12-26Z --depth 1 https://github.com/minio/minio.git . \
            && test "$(git rev-parse HEAD)" = "0d7408fc9969caf07de6a8c3a84f9fbb10a6739e"
        RUN go mod download && go mod verify \
            && go build -mod=readonly -p=2 -trimpath -o /out/minio .
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=build /out/minio /usr/local/bin/minio
        ENTRYPOINT ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: photo_music
      MINIO_ROOT_PASSWORD: photo_music_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Stay healthy after initializing the bucket so --wait also waits for it.
  minio-init:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24.2-bookworm AS build
        ENV GOTOOLCHAIN=local CGO_ENABLED=0
        WORKDIR /src
        RUN git clone --branch RELEASE.2025-04-16T18-13-26Z --depth 1 https://github.com/minio/mc.git . \
            && test "$(git rev-parse HEAD)" = "b00526b153a31b36767991a4f5ce2cced435ee8e"
        RUN go mod download && go mod verify \
            && go build -mod=readonly -p=2 -trimpath -tags kqueue -o /out/mc .
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=build /out/mc /usr/local/bin/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 photo_music photo_music_dev
        mc mb --ignore-existing local/photo-music-photos
        mc anonymous set none local/photo-music-photos
        touch /tmp/bucket-ready
        exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bucket-ready"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  minio-data:
  db-data:
