name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # Each check runs even if an earlier check failed, so one run reports
      # every problem. None of them run if the install failed.

      # Fails when lib/db/schema.ts changed without a committed migration.
      # `git status` also sees new, untracked files, which `git diff` misses.
      # drizzle-kit asks about renamed columns. With no terminal it prints an
      # error and exits 0 instead, so the step also fails when drizzle-kit
      # does not report that there is nothing to migrate. The timeout keeps a
      # prompt from holding the job.
      - name: Migrations match the schema
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          npm run db:generate 2>&1 | tee "$RUNNER_TEMP/db-generate.log"
          changes="$(git status --porcelain -- lib/db/migrations)"
          if [ -n "$changes" ] || ! grep -q "No schema changes" "$RUNNER_TEMP/db-generate.log"; then
            echo "$changes"
            echo "::error::lib/db/migrations does not match lib/db/schema.ts. Run npm run db:generate and commit the result."
            exit 1
          fi

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  # Starts the local database from docker-compose.yml, the same file that
  # developers use, and checks that the app can connect to it.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The local development URL from .env.example. Not a secret.
      DATABASE_URL: postgresql://photo_music:photo_music_dev@localhost:54320/photo_music

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Start the database
        id: start
        run: docker compose up -d --wait db

      - name: Check the connection
        run: npm run db:check

      - name: Apply the migrations
        run: npm run db:migrate

      # Creates, migrates and drops its own database next to DATABASE_URL's.
      # Runs also when the migrations failed, as long as the database started.
      - name: Run the database tests
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run test:db

      - name: Show the database log
        if: failure()
        run: docker compose logs db

      - name: Remove the database container and volume
        if: always()
        run: docker compose down -v

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: photo-music-photos
      S3_ACCESS_KEY_ID: photo_music
      S3_SECRET_ACCESS_KEY: photo_music_dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Start private MinIO bucket
        run: docker compose up -d --wait minio minio-init
      - name: Run real S3 tests
        run: npm run test:s3
      - name: Show storage logs
        if: failure()
        run: docker compose logs minio minio-init
      - name: Remove containers and volumes
        if: always()
        run: docker compose down -v
